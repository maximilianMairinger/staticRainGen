<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary Rain Generator</title>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #00ff00;
            --font-family: 'Space Mono', monospace;
        }

        *, *:before, *:after {
            box-sizing: border-box;
        }

        body {
            background-color: #111;
            color: #eee;
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar */
        #controls {
            width: 340px;
            background: #222;
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
            z-index: 10;
        }

        h2 { margin-top: 0; font-size: 1.2rem; border-bottom: 1px solid #444; padding-bottom: 10px; }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.85rem;
            color: #aaa;
            font-weight: 500;
        }

        input[type="text"],
        input[type="number"],
        select {
            background: #333;
            border: 1px solid #444;
            color: #fff;
            padding: 8px;
            border-radius: 4px;
            font-family: inherit;
            width: 100%;
        }

        input[type="color"] {
            width: 100%;
            height: 40px;
            border: none;
            cursor: pointer;
            background: none;
        }

        input[type="range"] {
            width: 100%;
        }
        
        button {
            background: #0066cc;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            margin-top: 10px;
        }
        button:hover { background: #0077ee; }

        /* Preview Area */
        #preview-container {
            flex: 1;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto;
            position: relative;
        }

        #output {
            font-family: var(--font-family);
            font-size: 16px;
            margin: 0;
            white-space: pre;
            line-height: 1;
            letter-spacing: 0;
            font-weight: 700;
            /* Ensure it doesn't shrink below content size */
            min-width: min-content; 
            min-height: min-content;
            transform-origin: 0 0;
        }

        #output-wrapper {
             /* Wrapper will take the exact target pixel size to force scrollbars on parent */
             overflow: hidden; 
             /* We might not want overflow:hidden if we want to see if it bleeds, but usually we match sizes. */
        }

        /* Utility */
        .row { display: flex; gap: 10px; }
        .control-stack { display: flex; flex-direction: column; gap: 15px; }
        .row > * { flex: 1; }
        
        .hint { font-size: 0.75rem; color: #666; margin-top: -2px; }

        .github-link {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: auto; /* Push to bottom if sidebar has height */
            padding: 10px;
            color: #666;
            transition: all 0.2s ease;
            border-radius: 12px;
            text-decoration: none;
        }

        .github-link:hover {
            color: #fff;
            background-color: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

<aside id="controls">
    <h2>Configuration</h2>

    <div class="row">
        <div class="control-group">
            <label for="width">Width (chars)</label>
            <input type="number" id="width" value="80" min="1">
            <div style="margin-top: 5px;">
                <label for="widthPx" style="display:block; font-size: 0.8rem; margin-bottom: 2px;">Or Width (px)</label>
                <input type="number" id="widthPx" placeholder="e.g. 800" min="1" style="width: 100%;" title="Value will be rounded to the nearest full character width on defocus">
            </div>
        </div>
        <div class="control-group">
            <label for="height">Height (chars)</label>
            <input type="number" id="height" value="40" min="1">
             <div style="margin-top: 5px;">
                <label for="heightPx" style="display:block; font-size: 0.8rem; margin-bottom: 2px;">Or Height (px)</label>
                <input type="number" id="heightPx" placeholder="e.g. 600" min="1" style="width: 100%;" title="Value will be rounded to the nearest full character height on defocus">
            </div>
        </div>
    </div>

    <div class="control-group">
        <label for="chars">Characters</label>
        <input type="text" id="chars" value="01">
    </div>

    <div class="control-group">
        <label for="fontName">Google Font Name</label>
        <input type="text" id="fontName" value="Space Mono" placeholder="e.g. Roboto Mono">
        <span class="hint">Will auto-load from Google Fonts</span>
    </div>

    <div class="row">
        <div class="control-group">
            <label for="textColor">Text Color</label>
            <input type="color" id="textColor" value="#00ff00">
        </div>
        <div class="control-group">
            <label for="bgColor">Background</label>
            <input type="color" id="bgColor" value="#000000">
        </div>
    </div>

    <div class="control-group">
        <label for="direction">Direction</label>
        <select id="direction">
            <option value="normal">Top-Down (Stalactites)</option>
            <option value="reverse">Bottom-Up (Stalagmites)</option>
        </select>
    </div>

    <div class="control-group">
        <label for="decay">Decay Chance (0-1)</label>
        <div class="row">
             <input type="range" id="decay" min="0" max="1000" value="0">
             <input type="number" id="decayInput" min="0" max="1" step="0.0001" value="0.05" style="width: 100px;">
        </div>
    </div>

    <div class="control-group">
        <label for="seed">Seed</label>
        <input type="text" id="seed" value="" placeholder="Random">
    </div>
    
    <button id="downloadPng">Download as PNG</button>
    <button id="download">Download HTML</button>

    <a href="https://github.com/maximilianMairinger/staticRainGen" target="_blank" class="github-link" aria-label="View Source on GitHub">
        <svg height="32" aria-hidden="true" viewBox="0 0 16 16" version="1.1" width="32" data-view-component="true">
            <path fill="currentColor" d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"></path>
        </svg>
    </a>
</aside>

<main id="preview-container">
    <div id="output-wrapper">
        <pre id="output"></pre>
    </div>
</main>

<script>
    // --- Logic ---

    // PRNG
    function mulberry32(a) {
        return function() {
          var t = a += 0x6D2B79F5;
          t = Math.imul(t ^ t >>> 15, t | 1);
          t ^= t + Math.imul(t ^ t >>> 7, t | 61);
          return ((t ^ t >>> 14) >>> 0) / 4294967296;
        }
    }

    function generateRain(config) {
        // Seed processing
        let seedVal = config.seed;
        // If seed is empty, generate a random one for this run, but don't save it to config unless user wants to.
        // Actually, if it's empty, we just use random().
        // If we want deterministic "empty" behavior, we might need a distinct random seed each time.
        // Let's assume if seed is empty string, we use Math.random() directly or a random seed.
        
        let random;
        if (!seedVal) {
             random = Math.random;
        } else {
            if (typeof seedVal === 'string') {
                let h = 0xdeadbeef;
                for(let i = 0; i < seedVal.length; i++)
                    h = Math.imul(h ^ seedVal.charCodeAt(i), 2654435761);
                seedVal = (h ^ h >>> 16) >>> 0;
            }
            random = mulberry32(seedVal);
        }
        
        const colLengths = [];

        // 1. Calculate column lengths
        for (let x = 0; x < config.width; x++) {
            let length = 0;
            while (length < config.height) {
                if (random() < config.decay) {
                   break;
                }
                length++;
            }
            colLengths.push(length);
        }

        let output = "";

        // 2. Render grid
        for (let y = 0; y < config.height; y++) {
            let rowStr = "";
            for (let x = 0; x < config.width; x++) {
                let isFilled = false;
                
                if (config.reverse) {
                    isFilled = y >= (config.height - colLengths[x]);
                } else {
                    isFilled = y < colLengths[x];
                }

                if (isFilled) {
                    const charIndex = Math.floor(random() * config.chars.length);
                    rowStr += config.chars[charIndex];
                } else {
                    rowStr += " ";
                }
            }
            output += rowStr + "\n";
        }
        return output;
    }

    // --- UI bindings ---

    const $ = id => document.getElementById(id);
    
    const els = {
        width: $('width'),
        widthPx: $('widthPx'),
        height: $('height'),
        heightPx: $('heightPx'),
        chars: $('chars'),
        fontName: $('fontName'),
        textColor: $('textColor'),
        bgColor: $('bgColor'),
        direction: $('direction'),
        decay: $('decay'),
        decayInput: $('decayInput'),
        seed: $('seed'),
        output: $('output'),
        outputWrapper: $('output-wrapper'),
        container: $('preview-container'),
        container: $('preview-container'),
        btnPng: $('downloadPng'),
        btnDownload: $('download')
    };

    // Logarithmic slider mapping
    // We want more precision at the low end (0-0.1).
    // Using x^4 curve: val = (slider/max)^4
    const SLIDER_MAX = 1000;
    
    function sliderToDecay(val) {
        const t = val / SLIDER_MAX;
        // t^3 gives reasonable curve. 0.5^3 = 0.125. 0.1^3 = 0.001
        return Math.pow(t, 3); 
    }

    function decayToSlider(val) {
        // slider = max * val^(1/3)
        return Math.cbrt(val) * SLIDER_MAX;
    }

    function updateDecayUI(val, source) {
        // Clamp 0-1
        let v = Math.max(0, Math.min(1, val));
        
        if (source !== 'input') {
            els.decayInput.value = v.toFixed(5).replace(/\.?0+$/, "");
        }
        if (source !== 'slider') {
            els.decay.value = decayToSlider(v);
        }
    }

    function measureCharDimensions(fontName) {
        // Create a temporary element to measure character dimensions
        const span = document.createElement('span');
        span.textContent = 'X';
        span.style.fontFamily = `"${fontName}", monospace`;
        span.style.fontSize = '16px'; // Explicit size to match render assumption
        span.style.fontWeight = '700';
        span.style.visibility = 'hidden';
        span.style.position = 'absolute';
        span.style.whiteSpace = 'pre';
        span.style.lineHeight = '1'; 
        
        document.body.appendChild(span);
        const rect = span.getBoundingClientRect();
        document.body.removeChild(span);
        return { width: rect.width, height: rect.height };
    }

    let currentFontLink = null;

    function loadGoogleFont(fontName) {
        if (!fontName) return;
        const id = 'font-' + fontName.replace(/\s+/g, '-');
        if (document.getElementById(id)) return; // Already loaded

        const link = document.createElement('link');
        link.id = id;
        link.rel = 'stylesheet';
        link.href = `https://fonts.googleapis.com/css2?family=${fontName.replace(/\s+/g, '+')}:wght@400;700&display=swap`;
        document.head.appendChild(link);
    }

    const STORAGE_KEY = 'binary_rain_config';

    function saveSettings() {
        const config = {
            width: els.width.value,
            height: els.height.value,
            chars: els.chars.value,
            fontName: els.fontName.value,
            textColor: els.textColor.value,
            bgColor: els.bgColor.value,
            direction: els.direction.value,
            direction: els.direction.value,
            decay: els.decayInput.value,
            seed: els.seed.value,
            scaleX: parseFloat(els.output.getAttribute('data-scale-x')) || 1,
            scaleY: parseFloat(els.output.getAttribute('data-scale-y')) || 1
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
    }

    function loadSettings() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            try {
                const config = JSON.parse(saved);
                if (config.width) els.width.value = config.width;
                if (config.height) els.height.value = config.height;
                if (config.chars) els.chars.value = config.chars;
                if (config.fontName) els.fontName.value = config.fontName;
                if (config.textColor) els.textColor.value = config.textColor;
                if (config.bgColor) els.bgColor.value = config.bgColor;
                if (config.direction) els.direction.value = config.direction;
                if (config.direction) els.direction.value = config.direction;
                if (config.decay) {
                     updateDecayUI(parseFloat(config.decay));
                }
                if (config.seed !== undefined) els.seed.value = config.seed;
                
                // Store scale in DOM for state persistence across renders (or could verify global var)
                // We'll trust the inputs to drive the chars logic, but we need to restore the scale state for render.
                if (config.scaleX) els.output.setAttribute('data-scale-x', config.scaleX);
                if (config.scaleY) els.output.setAttribute('data-scale-y', config.scaleY);

            } catch (e) {
                console.error("Failed to load settings", e);
            }
        }
    }

    function render() {
        const config = {
            width: parseInt(els.width.value) || 80,
            height: parseInt(els.height.value) || 40,
            chars: els.chars.value || "01",
            fontName: els.fontName.value || "Space Mono",
            textColor: els.textColor.value,
            bgColor: els.bgColor.value,
            reverse: els.direction.value === 'reverse',
            bgColor: els.bgColor.value,
            reverse: els.direction.value === 'reverse',
            decay: parseFloat(els.decayInput.value) || 0.05,
            seed: els.seed.value,
            
            // Read current scale state
            scaleX: parseFloat(els.output.getAttribute('data-scale-x')) || 1,
            scaleY: parseFloat(els.output.getAttribute('data-scale-y')) || 1
        };

        // Update CSS Variables
        document.documentElement.style.setProperty('--bg-color', config.bgColor);
        document.documentElement.style.setProperty('--text-color', config.textColor);
        
        // Font loading
        loadGoogleFont(config.fontName);
        document.documentElement.style.setProperty('--font-family', `'${config.fontName}', monospace`);

        // Generate Text
        const text = generateRain(config);
        els.output.textContent = text;
        
        // Apply Scale & Layout
        els.output.style.transform = `scale(${config.scaleX}, ${config.scaleY})`;
        
        // Set wrapper size to the "virtual" pixel size desired
        // If unscaled, it's just auto. If scaled, we want it to match the px inputs if available,
        // or just fit the scaled content.
        // Best approach: Measure the natural size, apply scale, set wrapper to that.
        
        // If we have explicit pixel targets in inputs, use those?
        // Actually, render shouldn't depend on inputs if possible, but config doesn't store targetPx.
        // Let's derive it: naturalSize * scale.
        
        // We need to wait for layout? No, textContent is sync.
        // But font loading might shift things. We have the resize observer or just relying on measure?
        // Let's assume font is stable or similar enough.
        
        // Reset wrapper to auto to measure natural size
        els.outputWrapper.style.width = '';
        els.outputWrapper.style.height = '';
        
        const naturalWidth = els.output.offsetWidth;
        const naturalHeight = els.output.offsetHeight;
        
        const targetWidth = naturalWidth * config.scaleX;
        const targetHeight = naturalHeight * config.scaleY;
        
        els.outputWrapper.style.width = `${targetWidth}px`;
        els.outputWrapper.style.height = `${targetHeight}px`;

        saveSettings();
    }

    function calculateOptimal(targetPx, charSize) {
        if (!charSize || charSize <= 0) return { count: 0, scale: 1 };
        
        const exactChars = targetPx / charSize;
        const low = Math.floor(exactChars);
        const high = Math.ceil(exactChars);
        
        if (low === 0) return { count: Math.max(1, high), scale: targetPx / (Math.max(1, high) * charSize) };
        
        const sizeLow = low * charSize;
        const sizeHigh = high * charSize;
        
        const scaleLow = targetPx / sizeLow;
        const scaleHigh = targetPx / sizeHigh;
        
        // Choose option closest to scale 1.0
        const diffLow = Math.abs(1 - scaleLow);
        const diffHigh = Math.abs(1 - scaleHigh);
        
        if (diffLow < diffHigh) {
            return { count: low, scale: scaleLow };
        } else {
            return { count: high, scale: scaleHigh };
        }
    }

    // Event Listeners
    [
        els.width, els.height, els.chars, 
        els.fontName, els.textColor, els.bgColor, 
        els.direction, els.decay, els.seed
    ].forEach(el => {
        el.addEventListener('input', (e) => {
            if(el === els.decay) {
                 const val = sliderToDecay(parseFloat(els.decay.value));
                 updateDecayUI(val, 'slider');
            }
            
            // Bidirectional binding for chars inputs - RESET SCALE
            if (el === els.width) {
                 els.output.setAttribute('data-scale-x', '1');
                 const chars = parseInt(els.width.value) || 0;
                 if (chars > 0) {
                     const dims = measureCharDimensions(els.fontName.value || "Space Mono");
                     els.widthPx.value = Math.floor(chars * dims.width);
                 }
            }
            if (el === els.height) {
                 els.output.setAttribute('data-scale-y', '1');
                 const chars = parseInt(els.height.value) || 0;
                 if (chars > 0) {
                     const dims = measureCharDimensions(els.fontName.value || "Space Mono");
                     els.heightPx.value = Math.floor(chars * dims.height);
                 }
            }

            render();
        });
    });

    els.decayInput.addEventListener('input', () => {
        const val = parseFloat(els.decayInput.value);
        if(!isNaN(val)) {
            updateDecayUI(val, 'input');
            render();
        }
    });

    // Width Px Binding
    els.widthPx.addEventListener('input', () => {
        const px = parseFloat(els.widthPx.value);
        if (px > 0) {
            const dims = measureCharDimensions(els.fontName.value || "Space Mono");
            if (dims.width > 0) {
                const optimal = calculateOptimal(px, dims.width);
                els.width.value = optimal.count;
                els.output.setAttribute('data-scale-x', optimal.scale);
                render();
            }
        }
    });

    els.widthPx.addEventListener('blur', () => {
         // No longer need strict rounding on blur since we support arbitrary px via zoom
         // But maybe align the input to match exactly what we are rendering?
         // render() updates the wrapper size, but we might want to keep the user's input.
    });

    // Height Px Binding
    els.heightPx.addEventListener('input', () => {
        const px = parseFloat(els.heightPx.value);
        if (px > 0) {
            const dims = measureCharDimensions(els.fontName.value || "Space Mono");
            if (dims.height > 0) {
                const optimal = calculateOptimal(px, dims.height);
                els.height.value = optimal.count;
                els.output.setAttribute('data-scale-y', optimal.scale);
                render();
            }
        }
    });

    els.heightPx.addEventListener('blur', () => {
        // No strict rounding needed
    });

    els.btnPng.addEventListener('click', () => {
        const config = {
            width: parseInt(els.width.value) || 80,
            height: parseInt(els.height.value) || 40,
            chars: els.chars.value || "01",
            fontName: els.fontName.value || "Space Mono",
            textColor: els.textColor.value,
            bgColor: els.bgColor.value,
        };
        
        // Measure char size explicitly for canvas scaling
        const dim = measureCharDimensions(config.fontName);
        const charW = dim.width;
        const charH = dim.height;

        const canvas = document.createElement('canvas');
        // Use exact pixel dimensions from inputs if available, or calc from chars * size * scale
        // Ideally we just use what the user sees in the wrapper size.
        // We can re-calculate targetPx from current settings:
        
        const scaleX = parseFloat(els.output.getAttribute('data-scale-x')) || 1;
        const scaleY = parseFloat(els.output.getAttribute('data-scale-y')) || 1;
        
        canvas.width = Math.ceil(config.width * charW * scaleX);
        canvas.height = Math.ceil(config.height * charH * scaleY);
        const ctx = canvas.getContext('2d');
        
        // Scale context
        ctx.scale(scaleX, scaleY);

        // Background
        // When scaling, we need to cover the full canvas. 
        // Logic: fillRect covers (0,0, width/scaleX, height/scaleY) or just fillRect(0,0, canvas.width, canvas.height) with identity scale?
        // ctx.scale affects drawing coordinates.
        // Let's reset transform for background to be safe/easy.
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = config.bgColor;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.restore();

        // Text
        ctx.font = `700 ${16}px '${config.fontName}', monospace`; // Assuming 1rem = 16px roughly for canvas, or we need to match measureCharDimensions
        // Wait, measureCharDimensions uses 1rem. We need to be consistent.
        // Let's force px size in measureCharDimensions or use a fixed px here.
        // measureCharDimensions uses '1rem'. Standard browser 1rem = 16px.
        // To be safe, let's use the computed style or just hardcode 16px if we want (since it's a generated image, 16px is fine).
        // Actually, let's use the computed font string from the span if possible, or just stick to 16px as the base.
        
        ctx.textBaseline = 'top';
        ctx.fillStyle = config.textColor;
        
        // We need to re-render the font property exactly as the browser sees it? 
        // The canvas font string format: "style weight size family"
        ctx.font = `bold 16px "${config.fontName}", monospace`;

        const lines = els.output.textContent.split('\n');
        for (let i = 0; i < lines.length; i++) {
             ctx.fillText(lines[i], 0, i * charH);
        }

        const url = canvas.toDataURL("image/png");
        const a = document.createElement('a');
        a.download = `binary_rain_${config.width}x${config.height}.png`;
        a.href = url;
        a.click();
    });

    els.btnDownload.addEventListener('click', () => {
        const config = {
            width: parseInt(els.width.value),
            height: parseInt(els.height.value),
            chars: els.chars.value,
            fontName: els.fontName.value,
            textColor: els.textColor.value,
            bgColor: els.bgColor.value,
            textColor: els.textColor.value,
            bgColor: els.bgColor.value,
            textColor: els.textColor.value,
            bgColor: els.bgColor.value,
            decay: !isNaN(parseFloat(els.decayInput.value)) ? parseFloat(els.decayInput.value) : 0.05,
            seed: els.seed.value,
            reverse: els.direction.value === 'reverse'
        };
        const content = els.output.textContent;
        
        const fileContent = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Binary Rain Static</title>
    <link href="https://fonts.googleapis.com/css2?family=${config.fontName.replace(/\s+/g, '+')}:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: ${config.bgColor};
            color: ${config.textColor};
            margin: 0;
            display: flex;
